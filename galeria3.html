<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galería - Bodas</title>
  <link rel="shortcut icon" href="IMAGENES/logou.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #F6EEDD;
      --beige: #C3A074;
      --vino: #A81C;
      --verde-oscuro: #27433B;
      --blanco: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--fondo);
      color: var(--verde-oscuro);
    }

    header {
      background-color: var(--verde-oscuro);
      padding: 1rem 0;
      text-align: center;
    }

    .back-btn {
      display: inline-block;
      background-color: var(--vino);
      color: var(--blanco);
      padding: 0.6rem 1.5rem;
      text-decoration: none;
      border-radius: 0.5rem;
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background-color: var(--beige);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    h1 {
      font-family: 'Cinzel', serif;
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2.2rem;
      color: var(--verde-oscuro);
    }

    .galeria-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .galeria-item {
      background: white;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }

    .galeria-item:hover {
      transform: translateY(-5px);
    }

    .galeria-item .img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #f0f0f0;
    }

    .galeria-item .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 600px) {
      .galeria-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">← Regresar al Inicio</a>
  </header>

  <div class="container">
    <h1>Pasteles de Boda</h1>
    <div class="galeria-grid">
      <!-- Reemplaza estas rutas con tus imágenes reales -->
      <div class="galeria-item">
        <div class="img-wrapper">
          <img src="IMAGENES/galeria1/1.jpg" alt="Pastel de boda 1">
        </div>
      </div>
      <div class="galeria-item">
        <div class="img-wrapper">
          <img src="IMAGENES/galeria1/2.jpg" alt="Pastel de boda 2">
        </div>
      </div>
      <div class="galeria-item">
        <div class="img-wrapper">
          <img src="IMAGENES/galeria1/3.jpg" alt="Pastel de boda 3">
        </div>
      </div>
      <div class="galeria-item">
        <div class="img-wrapper">
          <img src="IMAGENES/galeria1/4.jpg" alt="Pastel de boda 4">
        </div>
      </div>
      <div class="galeria-item">
        <div class="img-wrapper">
          <img src="IMAGENES/galeria1/5.jpg" alt="Pastel de boda 5">
        </div>
      </div>
      <div class="galeria-item">
        <div class="img-wrapper">
          <img src="IMAGENES/galeria1/6.jpg" alt="Pastel de boda 6">
        </div>
      </div>
    </div>
  </div>

</body>
</html>
